# ReadyHai operator settings — tool/plugin toggles.
# Usage: readyhai scan --settings settings.toml ...   (or READYHAI_SETTINGS=settings.toml)
# This file is operator-owned. A scanned repo's own readyhai/settings file is NEVER read.
#
# Tri-state values: "auto" (default, today's behaviour), "on", "off".
#   off  -> check is Skipped with a visible reason in the report (never hidden)
#   on   -> settings alone will never skip it. It does NOT bypass the profile,
#           scope nonprod, --no-tools, --profile or Docker-availability gates.
# Resolution per check: exact [[toggle]] id > LAST matching glob > category switch > auto.

[integrations]
tools = "auto"     # pinned-container tool checks (tools.lock.toml images)
plugins = "auto"   # plugin.* checks from the plugins directory
intrusive = "auto" # kill switch for the intrusive class: auto | off only ("on" is rejected —
                   # settings can silence intrusive checks but never force one to run)

# Per-check toggles, evaluated top to bottom; the LAST matching rule wins among globs.
# [[toggle]]
# id = "tool.nuclei"          # exact check id (see `readyhai checks`)
# enabled = "off"
#
# [[toggle]]
# id = "plugin.crowdstrike.*" # glob; place broad rules first, narrow exceptions after
# enabled = "off"
#
# [[toggle]]
# id = "plugin.crowdstrike.falcon-sensor-audit"
# enabled = "on"              # ...except this one

# Safe exploit-verification of recorded findings (src/exploits.rs, the UI Verify
# buttons, POST /api/exploits/run, `readyhai exploits run`). Strictly opt-in:
# while enabled = false the API answers 409 and the CLI refuses before any probe.
[exploits]
enabled = false     # NEVER defaults to true; verification re-reads the finding's
                    # own URL through the scope guard (prod hosts stay refused)
max_probes = 25     # template executions per run (1..100); rows past the budget
                    # are reported as skipped, never silently dropped
