<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 64" width="100%" height="100%">
  <defs>
    <linearGradient id="logoBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="logoCyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#00F0FF"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
    <linearGradient id="logoCheckGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#E0F2FE"/>
    </linearGradient>
    <filter id="logoGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Icon Symbol (64x64 at 0,0) -->
  <g transform="translate(4, 4) scale(0.4375)">
    <!-- Squircle Base -->
    <rect x="4" y="4" width="120" height="120" rx="28" fill="url(#logoBgGrad)" stroke="#1E293B" stroke-width="2"/>
    <!-- Outer Halo -->
    <path d="M64 20 L96 34 V64 C96 84 82 101 64 107 C46 101 32 84 32 64 V34 Z" 
          fill="none" stroke="#00F0FF" stroke-width="2" stroke-opacity="0.3" stroke-dasharray="4 4"/>
    <!-- Main Shield -->
    <path d="M64 25 L92 37 V64 C92 81.5 80 96.5 64 102 C48 96.5 36 81.5 36 64 V37 Z" 
          fill="#090D16" stroke="url(#logoCyanGrad)" stroke-width="3.5" stroke-linejoin="round"/>
    <!-- Shield Facets -->
    <path d="M64 27 V101" stroke="#00F0FF" stroke-width="1.5" stroke-opacity="0.35"/>
    <path d="M37 64 H91" stroke="#00F0FF" stroke-width="1.5" stroke-opacity="0.25"/>
    <!-- Checkmark -->
    <path d="M49 63 L60 74 L81 49" 
          fill="none" stroke="url(#logoCheckGrad)" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round" filter="url(#logoGlow)"/>
    <!-- Nodes -->
    <circle cx="64" cy="25" r="3" fill="#00F0FF"/>
    <circle cx="92" cy="37" r="2.5" fill="#38BDF8"/>
    <circle cx="36" cy="37" r="2.5" fill="#38BDF8"/>
    <circle cx="64" cy="102" r="3" fill="#0284C7"/>
  </g>

  <!-- Typography -->
  <text x="72" y="38" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="700" fill="#F8FAFC" letter-spacing="-0.5">
    Ready<tspan fill="#00F0FF">Hai</tspan>
  </text>
  <text x="72" y="52" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="500" fill="#94A3B8" letter-spacing="1.2">
    SECURITY &amp; READINESS GATE
  </text>
</svg>
