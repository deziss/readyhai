name: Publish images

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Publishing is gated twice: the ref must be the release tag for the version in VERSION, and the
  # full CI workflow (fmt, clippy, tests, frontend, python) must pass first.
  verify:
    name: Tag matches VERSION
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Require the release tag for VERSION
        run: |
          if [[ "${GITHUB_REF_TYPE}" != "tag" ]]; then
            echo "Error: images are published from release tags (vX.Y.Z), not from ${GITHUB_REF}" >&2
            exit 1
          fi
          FILE_VERSION="$(tr -d '[:space:]' < VERSION)"
          if [[ "${GITHUB_REF_NAME}" != "v${FILE_VERSION}" ]]; then
            echo "Error: tag ${GITHUB_REF_NAME} does not equal v${FILE_VERSION} (the VERSION file)" >&2
            exit 1
          fi
          echo "Verified: tag ${GITHUB_REF_NAME} matches VERSION ${FILE_VERSION}"

  ci:
    name: CI
    uses: ./.github/workflows/ci.yml

  image:
    name: ${{ matrix.name }}
    needs: [verify, ci]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: readyhai
            image: ghcr.io/deziss/readyhai
            context: .
            file: Dockerfile
          - name: readyhai-frontend
            image: ghcr.io/deziss/readyhai-frontend
            context: frontend
            file: frontend/Dockerfile
          - name: readyhai-playwright-runner
            image: ghcr.io/deziss/readyhai-playwright-runner
            context: runners/playwright
            file: runners/playwright/Dockerfile
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata (semver + sha tags)
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ matrix.image }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=long
          labels: |
            org.opencontainers.image.title=ReadyHai
            org.opencontainers.image.description=Self-hosted security scanner, autonomous pentest & QA agent, and production-readiness gate
            org.opencontainers.image.url=https://github.com/${{ github.repository }}
            org.opencontainers.image.documentation=https://github.com/${{ github.repository }}/blob/main/docs/README.md
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.licenses=AGPL-3.0-only

      - name: Build and push (amd64, arm64) with SBOM
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          platforms: linux/amd64,linux/arm64
          push: true
          sbom: true
          provenance: mode=max
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

      - name: Attest build provenance (SLSA)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ matrix.image }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
