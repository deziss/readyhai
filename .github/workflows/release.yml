name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  publish-release:
    name: Build & Publish Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Verify Version matches Tag
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          FILE_VERSION="$(tr -d '[:space:]' < VERSION)"
          if [[ "$TAG_VERSION" != "$FILE_VERSION" ]]; then
            echo "Error: Tag ($TAG_VERSION) does not match VERSION file ($FILE_VERSION)!" >&2
            exit 1
          fi
          echo "Verified tag matches VERSION: $TAG_VERSION"

      - name: Build Release Binary
        run: cargo build --release

      - name: Package Binary Artifact
        run: |
          mkdir -p dist
          cp target/release/readyhai dist/
          tar -czf dist/readyhai-linux-x86_64.tar.gz -C dist readyhai
          (cd dist && sha256sum readyhai-linux-x86_64.tar.gz > readyhai-linux-x86_64.tar.gz.sha256)

      - name: Attest build provenance (tarball + checksum)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/readyhai-linux-x86_64.tar.gz
            dist/readyhai-linux-x86_64.tar.gz.sha256

      - name: Build release title & description from CHANGELOG
        id: title
        # Every tag must ship a titled, described release: a highlighted-point
        # summary distilled from the CHANGELOG section, then the full section.
        # Fails the workflow when the tag has no CHANGELOG entry.
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          python3 scripts/release_notes.py --title "$VERSION" > dist/release-title.txt
          python3 scripts/release_notes.py "$VERSION" dist/release-notes.md
          echo "---- release title ----"
          cat dist/release-title.txt
          echo "---- release description (head) ----"
          head -12 dist/release-notes.md
          # single-line title: plain key=value is safe ($() trims the newline)
          echo "title=$(cat dist/release-title.txt)" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          name: ${{ steps.title.outputs.title }}
          body_path: dist/release-notes.md
          draft: false
          prerelease: false
          files: |
            dist/readyhai-linux-x86_64.tar.gz
            dist/readyhai-linux-x86_64.tar.gz.sha256
