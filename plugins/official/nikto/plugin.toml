# Nikto - web server scanner -> vulnerability findings from XML report.
# Active content probing: intrusive => deep profile + non-prod only.
# IMAGE SWAPPED FROM the originally-specced securecodebox/nikto
# (sha256:47b4ccb1...): that image's Entrypoint is a SecureCodeBox wrapper
# (ruby /sectools/src/main.rb) that expects an SCB JSON spec on stdin instead
# of CLI flags, and its bundled nikto.pl 2.1.6 still prompts for CVE
# auto-submission at scan end. frapsoft/nikto drives nikto.pl 2.1.5 as a plain
# CLI (Entrypoint ["nikto.pl"]) - verified 2026-11-23 via docker inspect
# (RepoDigests) + functional run as uid 65534 producing clean XML with items.
# Shim: entrypoint /bin/sh because the DTD referenced by the XML
# (docs/nikto.dtd, CWD-relative in /etc/nikto.conf) resolves only from
# /etc/nikto; `cd` there then exec nikto.pl - `-output -` streams XML to
# stdout (verified: pure <?xml ...> on stdout, banner suppressed, zero parse
# noise; parse_nikto only scans <item> elements anyway). -maxtime 300 +
# -timeout 10 + -nolookup bound the scan well under the 600s tool timeout.
# Note nikto 2.1.x has no -OutputStdout (that is the OWASP-zap/2.2 line).
id = "nikto"
title = "Nikto web server scan"
kinds = ["web"]
profile = "deep"
# digest verified 2026-11-23 via docker inspect --format='{{index .RepoDigests 0}}' frapsoft/nikto:latest
image = "frapsoft/nikto@sha256:e2206e3a1d4950d363fb542e405664937c6db2a4fe4e97ee73dc34dcde00ad89"
network = true
host_gateway = true
intrusive = true
entrypoint = "/bin/sh"
stdout = true
format = "nikto-xml"
rule = "nikto-finding"
severity = "medium"
title_prefix = "Nikto"
# {url} (not {domain}) so the target port from the URL survives: nikto -h
# accepts scheme://host:port/path and derives port + TLS itself (verified).
args = ["-c", 'cd /etc/nikto && exec nikto.pl -h "{url}" -Format xml -output - -nointeractive -maxtime 300 -timeout 10']
