# Suite: the autonomous agent loop (agent::run_agentic_loop_with: spec given, dry_run false, nonprod
# scope, deterministic, no LLM) against the same qa-api fixture as the `qa-api` suite.
#
# The agent reports defects, not rule ids, so `rule` matches the FAILING ORACLE CHECK CODES of the
# defect's cases (authz, server_error, error_disclosure, contract_fields, delete_not_effective, ...)
# and `component` is the agent's path-only component (no method, ids resolved: /orders/4).
#
# Every seeded bug gates recall. A bug the agent cannot detect yet is listed with `known_gap = true`
# (reported on every run, not counted in recall); there is none at the moment. When a run finds a
# flagged bug the report says "known gap closed": delete the flag so it gates from then on.
name = "agent-api"
kind = "agent"
description = "Autonomous agent vs the 7 seeded bugs of the qa-api fixture"
expect_verdict = "NO_GO"

[target]
server = "tests/fixtures/qa-api/server.py"
spec = "tests/fixtures/qa-api/openapi.json"
profile = "standard"
max_steps = 50

[target.tokens]
alice = "alice-token"
bob = "bob-token"
admin = "admin-token"

[thresholds]
min_recall = 0.85
max_false_positives = 2
pass_k = true
stable_verdict = true
# A run sends ~60 requests in ~6 s (the agent paces itself at 10 requests/s). The request and time
# limits are also handed to the agent as its own run budget.
max_requests = 250
max_seconds = 120

[[expect]]
id = "idor"
rule = "authz"
component = "/orders*"
note = "bug 1: stateful BOLA chain (alice POSTs an order, bob GETs it) fails the authz check"

[[expect]]
id = "admin-no-auth"
rule = "authz"
component = "/admin/stats"
note = "bug 2: unauthenticated GET /admin/stats answers 200"

[[expect]]
id = "note-500"
rule = "server_error"
component = "/orders"
note = "bug 3: POST /orders with a note over 100 characters -> 500. Found by the boundary probe the planner generates from the spec's maxLength (the QA engine's case generator)"

[[expect]]
id = "traceback-leak"
rule = "server_error"
component = "/search"
note = "bug 4: q=' -> 500 with a traceback (reported as one 'Internal error details disclosed' defect)"

[[expect]]
id = "contract-total"
rule = "contract_fields"
component = "/orders/*"
note = "bug 5: GET /orders/2 omits the required field total. Found by reading the ids the collection lists and validating each body against the spec schema (the QA engine's validator)"

[[expect]]
id = "delete-noop"
rule = "delete_not_effective"
component = "/orders/*"
note = "bug 6: DELETE answers 204 but the order stays (found by the cleanup read-back)"

[[expect]]
id = "slow-report"
rule = "*"
component = "/reports/slow"
note = "bug 7: /reports/slow sleeps 1.5 s. Found by the latency oracle (the QA engine's 1000 ms p95 limit), confirmed by the verifier replay"
