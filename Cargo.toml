[package]
name = "readyhai"
version = "0.7.0"
edition = "2024"
description = "Self-hosted security scanner, autonomous pentest & QA agent, and production-readiness gate"
authors = ["Anshu Kushawaha <kushawahaanshu8858@gmail.com>"]
license = "AGPL-3.0-only"
readme = "README.md"
repository = "https://github.com/deziss/readyhai"
homepage = "https://github.com/deziss/readyhai"
keywords = ["security", "sast", "dast", "qa", "readiness-gate"]
categories = ["development-tools", "command-line-utilities"]

[dependencies]
anyhow = "1"
clap = { version = "4.6", features = ["derive", "env"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_norway = "0.9"
toml = "1"
sha2 = "0.10"
hex = "0.4"
walkdir = "2.5"
globset = "0.4"
regex = "1.13"
minijinja = "2"
time = { version = "0.3", features = ["formatting", "macros"] }
rand = "0.9"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls", "json"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "signal"] }
axum = "0.8"
tree-sitter = "0.25"
tree-sitter-python = "0.25.0"
tree-sitter-javascript = "0.25.0"
tree-sitter-typescript = "0.23.2"
tree-sitter-go = "0.25.0"
tree-sitter-php = "0.25.1"

[profile.dev]
debug = 0

[profile.release]
strip = true
lto = "thin"
