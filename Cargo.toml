[package]
name = "readyhai"
version = "0.1.0"
edition = "2024"
description = "Self-hosted QA tester and production-readiness gate"
license = "Apache-2.0"

[dependencies]
anyhow = "1"
clap = { version = "4.6", features = ["derive", "env"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_norway = "0.9"
toml = "1"
sha2 = "0.10"
hex = "0.4"
walkdir = "2.5"
globset = "0.4"
regex = "1.13"
minijinja = "2"
time = { version = "0.3", features = ["formatting", "macros"] }
rand = "0.9"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls", "json"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "signal"] }
axum = "0.8"

[profile.dev]
debug = 0

[profile.release]
strip = true
lto = "thin"
