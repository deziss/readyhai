readyhai:
  stage: test
  image:
    # Pin a version tag (or @sha256 digest) in production.
    name: ghcr.io/deziss/readyhai:latest
    # Image ENTRYPOINT is readyhai; clear it so the script runs in a shell.
    entrypoint: [""]
  script:
    - readyhai scan . --profile quick --format sarif,html,junit --out readyhai-report
  artifacts:
    when: always
    reports:
      junit: readyhai-report/readyhai-report.junit.xml
    paths:
      - readyhai-report/
  allow_failure:
    exit_codes:
      - 1
