# Copy to .github/workflows/readyhai.yml in the repo you want to gate.
# Runs the ReadyHai gate on every PR and keeps ONE summary comment up to date on it.
name: readyhai

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  pull-requests: write # PR summary comment
  security-events: write # SARIF upload

jobs:
  readyhai:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: ReadyHai gate
        id: readyhai
        uses: deziss/readyhai@v0.7.0 # pin a release tag
        with:
          target: .
          profile: quick
          fail-on: fail # fail | warn | never
          # no-tools: "true" # native checks only, no tool containers

      - name: Upload SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: readyhai-report/readyhai-report.sarif

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: readyhai-report
          path: readyhai-report/
